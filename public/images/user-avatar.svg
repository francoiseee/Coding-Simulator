<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1423" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>

    <!-- Ring Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#d000ff" />
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="avatarGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Glow Filter for Avatar -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="50" cy="38" r="14" fill="url(#avatarGrad)" filter="url(#softGlow)" />
  <!-- Body/Shoulders -->
  <path d="M26 73 C26 62, 34 54, 50 54 C66 54, 74 62, 74 73 C74 77, 72 81, 50 81 C28 81, 26 77, 26 73 Z" fill="url(#avatarGrad)" filter="url(#softGlow)" />

  <!-- Outer Neon Ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" filter="url(#neonGlow)" opacity="0.9" />

  <!-- Shiny Glass Arc Reflection (Top-Left Highlight) -->
  <path d="M12 40 A42 42 0 0 1 45 7" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.15" />
</svg>
